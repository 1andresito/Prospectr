<!-- index.html -->
<!DOCTYPE html>
<html>
<head>

    <title>Prospectr - Business Finder</title>
    <meta name="prospectr-token" content="{{ app_token }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

</head>
<body>

    <div id="search-bar">
        <input id="query-input" type="text" placeholder="e.g. restaurants (optional)" />
        <input id="location-input" type="text" placeholder="e.g. Washington, D.C" />
        <button id="category-btn">Category: No Website ▾</button>
        <button id="types-btn">Types: All ▾</button>
        <button id="search-btn">Search</button>
        <button id="settings-btn" title="Settings" aria-label="Settings">⚙️</button>
    </div>

    <div id="api-key-warning" class="hidden">
        No API key set —
        <button id="warning-settings-link">add one in Settings</button>
    </div>

    <div id="update-banner" style="display:none;">
        A new version of Prospectr is available.
        <a id="update-link" href="#" target="_blank" rel="noopener noreferrer">
            Download it here
        </a>
        <button onclick="document.getElementById('update-banner').style.display='none'">
            Dismiss
        </button>
    </div>

    <div id="version-badge">Checking version...</div>

    <div id="map"></div>

    <div id="loading-overlay" class="hidden" aria-hidden="true">
        <div class="loading-panel" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="loading-text">Searching businesses</p>
            <p class="loading-subtext">This may take a moment</p>
        </div>
    </div>

    <div id="category-overlay" class="hidden">
        <div class="category-panel" role="dialog" aria-label="Choose category">
            <div class="category-header">
                <h2>Find businesses missing...</h2>
                <button id="category-close-btn" aria-label="Close">&times;</button>
            </div>
            <div id="category-list"><!-- filled in by script.js --></div>
        </div>
    </div>

    <div id="types-overlay" class="hidden">
        <div class="category-panel" role="dialog" aria-label="Choose business types">
            <div class="category-header">
                <h2>Limit to specific types</h2>
                <button id="types-close-btn" aria-label="Close">&times;</button>
            </div>
            <div id="types-list"><!-- filled in by script.js --></div>
            <button id="types-clear-btn" class="category-option">
                Clear (search all types)
            </button>
        </div>
    </div>

    <div id="settings-overlay" class="hidden">
        <div class="settings-panel" role="dialog" aria-label="Settings">
            <div class="settings-header">
                <h2>API Keys</h2>
                <button id="settings-close-btn" aria-label="Close">&times;</button>
            </div>
            <div id="settings-fields"></div>
            <button id="settings-save-btn">Save</button>
            <p id="settings-status" class="settings-status"></p>
        </div>
    </div>

    <div id="analysis-panel" class="hidden" role="complementary" aria-label="Business details">
        <button id="analysis-close-btn" class="panel-close-btn" aria-label="Close">
            &times;
        </button>

        <div id="panel-scroll">
            <div id="business-photo-wrap">
                <img id="business-photo" class="hidden" alt="" />
                <div id="business-photo-placeholder">🏢</div>
            </div>

            <div class="panel-info">
                <h2 id="analysis-panel-title">Business Name</h2>
                <p id="analysis-address" class="business-address"></p>

                <div id="business-meta">
                    <span id="business-rating" class="meta-pill hidden"></span>
                    <span id="business-phone" class="meta-pill hidden"></span>
                </div>

                <div id="business-links"><!-- filled in by script.js --></div>

                <div id="business-badges"><!-- filled in by script.js --></div>

                <button id="analyze-btn" class="analyze-btn">
                    Analyze Marketing Strategies
                </button>

                <div id="analysis-content"></div>

                <div id="analysis-actions" class="hidden">
                    <button id="download-pdf-btn" title="Formatted report to read or send to the business">
                        Download PDF
                    </button>
                    <button id="download-ai-pdf-btn" title="Plain-text version to hand to an AI, e.g. to build a landing page">
                        Download AI PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!--
      These are vendored under static/vendor rather than loaded from a CDN so
      the packaged app still starts when the machine is offline or the CDN is
      blocked. Map tiles are the one thing that genuinely needs the network.
    -->
    <script src="{{ url_for('static', filename='vendor/jspdf.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>

    <script src="{{ url_for('static', filename='api.js') }}"></script>
    <script src="{{ url_for('static', filename='update-check.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
