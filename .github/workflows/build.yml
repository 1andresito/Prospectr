name: Build Prospectr Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            data_sep: ";"
            artifact_name: Prospectr-Windows
            build_path: dist/Prospectr.exe
            icon_file: icon.ico
          - os: macos-latest
            data_sep: ":"
            artifact_name: Prospectr-Mac
            build_path: dist/Prospectr
            icon_file: icon.icns
          - os: ubuntu-latest
            data_sep: ":"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows icon
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Build Mac icon
        if: matrix.os == 'macos-latest'
        run: |
          mkdir icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Build executable
        working-directory: core
        shell: bash
        run: |
          ARGS="--onefile --name Prospectr --add-data ../templates${{ matrix.data_sep }}templates --add-data ../static${{ matrix.data_sep }}static"
          if [ "${{ matrix.os }}" != "ubuntu-latest" ]; then
            ARGS="$ARGS --windowed --icon ../assets/${{ matrix.icon_file }}"
          fi
          pyinstaller $ARGS app.py

      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        working-directory: core
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/Prospectr AppDir/usr/bin/Prospectr
          chmod +x AppDir/usr/bin/Prospectr

          cp ../assets/icon.png AppDir/prospectr.png
          cp ../packaging/linux/Prospectr.desktop AppDir/Prospectr.desktop
          cp ../packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

          # --appimage-extract-and-run avoids needing FUSE on the CI runner
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir Prospectr-x86_64.AppImage

      - name: Upload build artifact
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: core/${{ matrix.build_path }}

      - name: Upload Linux AppImage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Prospectr-Linux
          path: core/Prospectr-x86_64.AppImage
